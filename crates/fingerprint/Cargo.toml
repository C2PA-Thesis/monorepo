[package]
name = "fingerprint"
description = "The HyperVerITAS lattice fingerprint of a 1024x512 image, for the prover and for the capture device"
version = "0.1.0"
license = "MIT"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib is the WebAssembly build the capture page loads.
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow.workspace = true
ark-bls12-381 = "0.4"
ark-ff = "0.4"
ark-std = "0.4"
hex.workspace = true
rand_chacha = "0.3"
serde.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# ark-std pulls rand/std, whose getrandom refuses to build for the browser without this.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
