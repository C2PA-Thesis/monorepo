AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One environment of provenance serve (dev or prod): an EC2 instance that only
  opens the app's TLS port, a data volume and an address that outlive it, the
  role GitHub Actions deploys to it with, and the hours it runs. Needs the
  provenance-account stack.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
    Description: Also the GitHub environment allowed to deploy here.
  Repository:
    Type: String
    # The repository's OIDC subject uses immutable names, with the owner and
    # repository ids (GET /repos/{repo}/actions/oidc/customization/sub).
    Default: C2PA-Thesis@315084930/monorepo@1330216684
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A public subnet of VpcId.
  InstanceType:
    Type: String
    # The only free plan type with memory for the crop proof's 5.7 GB peak.
    Default: m7i-flex.large
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  Hours:
    Type: String
    AllowedValues: [office, stop-nightly, always]
    Default: stop-nightly
    Description: >-
      office starts the instance at 9:00 on weekdays and stops it at 21:00;
      stop-nightly only stops it at 21:00; always leaves it alone.
      Buenos Aires time.

Conditions:
  StartsInTheMorning: !Equals [!Ref Hours, office]
  StopsAtNight: !Not [!Equals [!Ref Hours, always]]

Resources:
  Listener:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub provenance ${Env}, only the app TLS listener
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8792
          ToPort: 8792
          CidrIp: 0.0.0.0/0
          Description: The app pins the listener key
      Tags:
        - Key: Project
          Value: tesis-td8

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-releases
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - arn:${AWS::Partition}:s3:::${Bucket}/releases/*
                  - Bucket: !ImportValue provenance-releases
        # The DeviceCheck key for Apple's risk metric, put there by hand.
        - PolicyName: read-devicecheck-key
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/provenance/apple/*
      Tags:
        - Key: Project
          Value: tesis-td8

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  Template:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref ImageId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - Key: Project
                Value: tesis-td8

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref Template
        Version: !GetAtt Template.LatestVersionNumber
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref Listener
      Tags:
        - Key: Name
          Value: !Sub provenance-${Env}
        - Key: Project
          Value: tesis-td8

  # The TLS key and the trusted phones live here, not on the root volume,
  # so they survive the instance being replaced. The app pins that key.
  Data:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt Instance.AvailabilityZone
      Size: 20
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub provenance-${Env}-data
        - Key: Project
          Value: tesis-td8

  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Instance
      VolumeId: !Ref Data
      # release.sh mounts it at /var/lib/provenance.
      Device: /dev/sdf

  # A fixed address across stops: the app has it built in.
  Address:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - Key: Project
          Value: tesis-td8

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub GitHub Actions deploys to provenance ${Env}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !ImportValue provenance-github-oidc
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs in this GitHub environment, which only its branch can use.
                token.actions.githubusercontent.com:sub: !Sub repo:${Repository}:environment:${Env}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub
                  - arn:${AWS::Partition}:s3:::${Bucket}/releases/*
                  - Bucket: !ImportValue provenance-releases
              - Effect: Allow
                Action: ec2:StartInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              # These take no resource.
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ssm:DescribeInstanceInformation
                  - ssm:GetCommandInvocation
                Resource: "*"
      Tags:
        - Key: Project
          Value: tesis-td8

  SchedulerRole:
    Type: AWS::IAM::Role
    Condition: StopsAtNight
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: start-and-stop
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
      Tags:
        - Key: Project
          Value: tesis-td8

  Morning:
    Type: AWS::Scheduler::Schedule
    Condition: StartsInTheMorning
    Properties:
      Description: !Sub Start provenance ${Env} on weekday mornings
      ScheduleExpression: cron(0 9 ? * MON-FRI *)
      ScheduleExpressionTimezone: America/Argentina/Buenos_Aires
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:startInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds": ["${Instance}"]}'

  Night:
    Type: AWS::Scheduler::Schedule
    Condition: StopsAtNight
    Properties:
      Description: !Sub Stop provenance ${Env} every night
      ScheduleExpression: cron(0 21 * * ? *)
      ScheduleExpressionTimezone: America/Argentina/Buenos_Aires
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds": ["${Instance}"]}'

Outputs:
  InstanceId:
    Description: The GitHub environment's AWS_INSTANCE_ID.
    Value: !Ref Instance
  DeployRoleArn:
    Description: The GitHub environment's AWS_DEPLOY_ROLE.
    Value: !GetAtt DeployRole.Arn
  Address:
    Description: The fixed public IP, for the app's servers.json.
    Value: !Ref Address
