<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <title>Capture</title>
  </head>
  <body class="phone">
    <header class="top brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg>
      <h1>Capture</h1>
    </header>

    <main class="steps">
      <section class="step card" id="step-pair" data-state="active">
        <div class="step-head">
          <span class="step-num">1</span>
          <h2>Pair</h2>
          <p class="step-summary" id="pair-summary"></p>
        </div>
        <div class="step-body">
          <p id="pair-status" class="muted">Creating key…</p>
          <form id="pair-form" class="pair-form" hidden>
            <input id="pair-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required aria-label="Pairing code" />
            <button type="submit">Pair</button>
          </form>
        </div>
      </section>

      <section class="step card" id="step-photo" data-state="locked">
        <div class="step-head">
          <span class="step-num">2</span>
          <h2>Photo</h2>
          <p class="step-summary" id="photo-summary"></p>
        </div>
        <div class="step-body">
          <p class="gps" id="gps" data-state="waiting">
            <span class="pill warn"><span class="gps-dot"></span><span id="gps-text">Waiting for GPS</span></span>
          </p>
          <p id="gps-help" class="small-line" hidden></p>
          <label class="button button-wide" id="photo-button">
            <svg class="icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>Open camera</span>
            <input id="photo" type="file" accept="image/*" capture="environment" hidden />
          </label>
          <p id="photo-error" class="small-line error-text" hidden></p>
        </div>
      </section>

      <section class="step card" id="step-frame" data-state="locked">
        <div class="step-head">
          <span class="step-num">3</span>
          <h2>Crop</h2>
          <p class="step-summary" id="frame-summary"></p>
        </div>
        <div class="step-body">
          <div id="stage" class="stage">
            <canvas id="preview" width="1024" height="512"></canvas>
            <div id="crop-box" class="crop-box"></div>
          </div>
          <input id="frame" type="range" min="0" max="1" step="0.001" value="0.5" aria-label="Frame the photo" />
          <div class="presets" id="presets"></div>
          <p class="small-line muted">The dimmed part stays private.</p>
        </div>
      </section>

      <section class="step card" id="step-region" data-state="locked">
        <div class="step-head">
          <span class="step-num">4</span>
          <h2>Area</h2>
          <p class="step-summary" id="region-summary"></p>
        </div>
        <div class="step-body">
          <div id="map-slot"></div>
          <label class="control">
            <span class="control-row"><span class="meta">Size</span><span id="resolution-text" class="num"></span></span>
            <input id="resolution" type="range" min="0" max="15" step="1" value="7" />
          </label>
          <p id="cell-text" class="small-line error-text" hidden></p>
          <p id="accuracy-warning" class="small-line warn-text" hidden></p>
        </div>
      </section>

      <section class="step card" id="step-send" data-state="locked">
        <div class="step-head">
          <span class="step-num">5</span>
          <h2>Send</h2>
          <p class="step-summary" id="send-summary"></p>
        </div>
        <div class="step-body">
          <div class="leaves small-line muted">
            <p>Published: crop, cell, time, fingerprint, proof</p>
            <p>Private: full photo, exact position</p>
          </div>
          <button id="submit" class="button-wide" type="button">Sign and send</button>
          <ol id="local-steps" class="local-steps" hidden></ol>
        </div>
      </section>

      <section class="step card" id="step-laptop" data-state="locked">
        <div class="step-head">
          <span class="step-num">6</span>
          <h2>Publishing</h2>
          <p class="step-summary" id="laptop-summary"></p>
        </div>
        <div class="step-body" id="laptop-body"></div>
      </section>

      <section class="card result" id="result" hidden></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
