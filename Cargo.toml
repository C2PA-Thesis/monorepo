[workspace]
resolver = "2"
members = ["crates/crop-proof", "crates/fingerprint", "crates/provenance"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Proving over 2^19 pixels is unusable without optimizations, including in tests.
[profile.dev.package."*"]
opt-level = 3

# The fingerprint the capture page loads: one small module, no unwinding.
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
