[package]
name = "bench"
description = "Benchmark suite for the proof pipeline: isolated, repeated samples and a report"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crop-proof = { path = "../crop-proof" }
hex.workspace = true
libc = "0.2"
provenance = { path = "../provenance" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }

[features]
# Counts live heap bytes per phase of the crop prover, for `bench probe`.
mem-profile = ["crop-proof/probe"]
