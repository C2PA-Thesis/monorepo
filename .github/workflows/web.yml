name: web

on:
  push:
    paths: &paths
      - 'web/**'
      - 'crates/fingerprint/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths: *paths

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Add the WebAssembly target for the fingerprint
        run: rustup target add wasm32-unknown-unknown

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build the fingerprint for the browser
        working-directory: web
        run: npm run wasm

      - name: Check the envelope, the receipt bytes and the wasm digest against their vectors
        working-directory: web
        run: npm test

      - name: Type-check and build the page
        working-directory: web
        run: npm run build
