name: scripts

on:
  push:
    paths: &paths
      - 'scripts/**'
      - 'ios/scripts/**'
      - 'crates/fingerprint-ffi/c/*.sh'
      - '.github/workflows/scripts.yml'
  pull_request:
    paths: *paths

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint every script
        run: >
          shellcheck --external-sources --source-path=SCRIPTDIR
          scripts/*.sh ios/scripts/*.sh crates/fingerprint-ffi/c/*.sh
