name: provenance web lab

on:
  push:
    paths: ['web/**', 'pipeline/**', 'fixtures/**', 'editproof/**', 'locproof/**', 'c2pa/**', '.gitmodules', '.github/workflows/web-lab.yml']
  pull_request:
    paths: ['web/**', 'pipeline/**', 'fixtures/**', 'editproof/**', 'locproof/**', 'c2pa/**', '.gitmodules', '.github/workflows/web-lab.yml']
  workflow_dispatch:

jobs:
  build-and-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            web/requirements.txt
            pipeline/requirements.txt
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web run build
      - run: python -m pip install -r web/requirements.txt
      - run: bash -n web/run.sh
      - name: Test uploads, isolation, failure and cancellation
        env:
          PYTHONPATH: pipeline:web
        run: python -m unittest discover -s web/tests -v

  real-web-proof-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: locproof/go.sum
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editproof/hyperveritas_impl
      - name: Prepare the real proof tools and web app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          C2PA_BIN_DIR: ${{ github.workspace }}/bin
        run: |
          ./pipeline/setup.sh
          pipeline/.venv/bin/python -m pip install -r web/requirements.txt
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
      - name: Start the web entry point and run a real uploaded-image experiment
        env:
          C2PA_BIN_DIR: ${{ github.workspace }}/bin
        run: pipeline/.venv/bin/python web/tests/integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provenance-web-integration
          path: web/generated/integration/
          if-no-files-found: warn
