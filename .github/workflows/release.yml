name: release

on:
  push:
    branches: [main, dev]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-release.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Each environment only accepts its own branch: prod main, dev dev.
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-2

      - name: Ship the release to the instance
        run: deploy/ship.sh release.tgz
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          RELEASES_BUCKET: ${{ vars.AWS_RELEASES_BUCKET }}
          REVISION: ${{ github.sha }}
