name: scripts

on:
  push:
    paths: ['scripts/**', '.github/workflows/scripts.yml']
  pull_request:
    paths: ['scripts/**', '.github/workflows/scripts.yml']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint every script
        run: shellcheck --external-sources --source-path=SCRIPTDIR scripts/*.sh
