AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  What the dev and prod environments of provenance serve share: GitHub's OIDC
  provider, so Actions deploys without stored keys, and the bucket releases go
  through.

# The OIDC provider is created once outside this stack: an account holds one
# provider per URL, and the organization's policy may reserve creating it.

Resources:
  Releases:
    Type: AWS::S3::Bucket
    # Every release can be built again from its commit.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub provenance-releases-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-releases
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: tesis-td8

  ReleasesOverTlsOnly:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Releases
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt Releases.Arn
              - !Sub ${Releases.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  GitHubOidcArn:
    Value: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
    Export:
      Name: provenance-github-oidc
  ReleasesBucket:
    Value: !Ref Releases
    Export:
      Name: provenance-releases
